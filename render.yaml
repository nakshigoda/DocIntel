services:
  - type: web
    name: docintel-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false          # Set manually in Render dashboard — never commit the real value
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: MONGO_URI
        sync: false          # Set manually in Render dashboard (MongoDB Atlas URI)
